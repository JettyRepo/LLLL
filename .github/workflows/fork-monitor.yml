name: Fork Monitor

# Forks are allowed: the license is MIT and the README says "free to use, fork, and build on".
# This job only reports them, so that a derivative project presented as an official Layrix
# product (which the README asks people not to do) can be noticed. It never fails the run.

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:        # manual trigger

permissions:
  contents: read

jobs:
  list-forks:
    runs-on: ubuntu-latest
    steps:
      - name: List forks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          FORKS=$(gh api --paginate "repos/$REPO/forks" --jq '.[].full_name' || true)
          if [ -z "$FORKS" ]; then
            echo "No forks."
            exit 0
          fi
          for FORK in $FORKS; do
            if gh api "repos/$FORK/contents/LICENSE" >/dev/null 2>&1; then
              echo "::notice::Fork $FORK keeps a LICENSE file."
            else
              echo "::notice::Fork $FORK has no LICENSE file at its root. MIT asks that the copyright notice is kept; look at it if you want to."
            fi
          done
          exit 0
