name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: llll-guard/package-lock.json

      - name: Install
        working-directory: llll-guard
        run: npm ci

      - name: Lint and type-check (source and tests)
        working-directory: llll-guard
        run: npm run lint

      - name: Test
        working-directory: llll-guard
        run: npm test

      - name: Build
        working-directory: llll-guard
        run: npm run build

      - name: The package passes its own release gate
        working-directory: llll-guard
        run: node dist/index.js release

      - name: Repository integrity
        run: ./verify.sh

  audit:
    name: npm audit (published dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit
        working-directory: llll-guard
        run: npm audit --omit=dev --audit-level=high
