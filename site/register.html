<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register · Layrix</title>
<meta name="description" content="Register for LLLL — free. One email, no card, no tracking. Unlock the full compliance read-out and your Academy track." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site-shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  .reg-input {
    width: 100%;
    padding: 16px 18px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper-2);
    border: 1px solid var(--ink);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .reg-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(47, 111, 74, 0.18);
  }
  .reg-input::placeholder { color: var(--muted); }
  .reg-submit {
    padding: 16px 28px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease;
  }
  .reg-submit:hover { transform: translateY(-1px); background: var(--accent); border-color: var(--accent); }
  .reg-check {
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 10px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
  }
  .reg-check strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/site-chrome.jsx"></script>
<script type="text/babel">
const ink='var(--ink)', paper='var(--paper)', paper2='var(--paper-2)', muted='var(--muted)', rule='var(--rule)', accent='var(--accent)';

function Hero() {
  return (
    <section style={{ padding: '88px clamp(20px, 5vw, 56px) 0', textAlign:'center' }}>
      <div className="marq-tag" style={{ borderColor: accent, color: accent }}>LAYRIX · LLLL · FREE TIER</div>
      <h1 style={{ fontFamily:'var(--display)', fontWeight:500, fontSize:'clamp(52px, 7.4vw, 112px)', lineHeight:1, letterSpacing:'-0.045em', margin:'36px auto 0', maxWidth: 1100 }}>
        Register for LLLL.<br/><span style={{ fontStyle:'italic', color: accent }}>Free.</span>
      </h1>
      <p style={{ fontSize:19, lineHeight:1.6, color:muted, maxWidth: 680, margin:'40px auto 0' }}>
        One email. No card. No tracking. Unlock the full compliance read-out, deep-dive review, and your Academy track.
      </p>
    </section>
  );
}

function Form() {
  return (
    <section style={{ padding: '64px clamp(20px, 5vw, 56px) 0', maxWidth: 720, margin: '0 auto' }}>
      <form action="/api/register" method="POST" style={{ display: 'grid', gap: 14 }}>
        <label htmlFor="email" style={{ fontFamily:'var(--mono)', fontSize:11, color:muted, letterSpacing:'0.18em', textTransform:'uppercase' }}>
          Email
        </label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autoComplete="email"
          placeholder="you@company.com"
          className="reg-input"
        />
        <label htmlFor="tos" style={{ display:'grid', gridTemplateColumns:'auto 1fr', gap:10, alignItems:'start', marginTop: 8, fontSize: 13, lineHeight: 1.55, color: muted }}>
          <input id="tos" name="tos_accepted" type="checkbox" required value="1" style={{ marginTop: 4, accentColor: 'var(--accent)' }} />
          <span>
            I agree to the <a className="marq-link" href="/terms" style={{ color: ink, fontWeight: 500 }}>Terms of Service</a>, <a className="marq-link" href="/privacy" style={{ color: ink, fontWeight: 500 }}>Privacy Policy</a>, and <a className="marq-link" href="/acceptable-use" style={{ color: ink, fontWeight: 500 }}>Acceptable Use Policy</a>.
          </span>
        </label>
        <div style={{ display:'flex', justifyContent:'flex-start', marginTop: 14 }}>
          <button type="submit" className="reg-submit">Create account →</button>
        </div>
      </form>
    </section>
  );
}

function WhatYouGet() {
  const items = [
    ['Full compliance read-out', 'Every triggered domain, every file:line gap, every owned action — no truncation, no upsell.'],
    ['Deep-dive review', 'Beyond the daily check: pre-release review of agentic patterns, third-party flows, and data-governance gaps.'],
    ['Push & release gates', 'LLLL Guard blocks the leak before it leaves your machine — secrets, source maps, private keys.'],
    ['Academy access', 'Sample lessons from the AIGP Track. Enroll any time to unlock the full $200 program.'],
  ];
  return (
    <SectionRow idx="01" kicker="What you get"
      title={<>One account. <span style={{ fontStyle:'italic', color: accent }}>Everything that's free.</span></>}>
      <div className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap: 16, marginTop: 56 }}>
        {items.map(([h, b]) => (
          <div key={h} className="marq-card" style={{ background: paper2, padding:'28px 26px', borderRadius: 14, border:`1px solid ${rule}` }}>
            <h3 style={{ fontFamily:'var(--display)', fontSize: 26, fontWeight: 500, letterSpacing:'-0.02em', lineHeight: 1.2 }}>{h}</h3>
            <p style={{ fontSize: 14.5, lineHeight: 1.6, color: muted, marginTop: 12 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function Trust() {
  const points = [
    [<><strong>No credit card.</strong> The free tier is free — no surprise charge after a trial.</>, '✓'],
    [<><strong>No tracking pixels.</strong> No analytics on this page beyond a server access log.</>, '✓'],
    [<><strong>Email only.</strong> No name, phone, or address required. <a className="marq-link" href="/privacy" style={{ color: ink, fontWeight:500 }}>See what we store</a>.</>, '✓'],
    [<><strong>Local-first by design.</strong> LLLL itself runs in your CLI — your code never leaves your machine.</>, '✓'],
  ];
  return (
    <SectionRow idx="02" kicker="Why register"
      title={<>What this account <span style={{ fontStyle:'italic', color: accent }}>is — and isn't.</span></>}>
      <ul style={{ listStyle:'none', padding: 0, margin: '56px 0 0', display:'grid', gap: 18, maxWidth: 760 }}>
        {points.map(([body, mark], i) => (
          <li key={i} className="reg-check">
            <span style={{ color: accent, fontWeight: 700 }}>{mark}</span>
            <span>{body}</span>
          </li>
        ))}
      </ul>
    </SectionRow>
  );
}

function App() {
  return (
    <>
      <Header />
      <Hero />
      <Form />
      <WhatYouGet />
      <Trust />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
