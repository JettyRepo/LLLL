<script type="text/babel">
const sections = [
  { h: 'Objet', body: <p>Layrix fournit des outils d’analyse de conformité conçus pour aider les équipes de développement à identifier et combler les écarts de conformité dans le logiciel construit avec l’IA. La présente politique établit des lignes directrices pour une utilisation responsable afin que le Service demeure fiable, digne de confiance et bénéfique pour tous les utilisateurs.</p> },
  { h: 'Utilisations interdites', body: <><p>Le logiciel — la compétence LLLL, la CLI Guard, les listes de vérification de conformité, les méthodologies de notation, les patrons de scan et de garde, et la documentation associée — est sous licence MIT. Vous êtes libre de l’utiliser, le modifier, le forker et le redistribuer, y compris à des fins commerciales et y compris pour construire des produits concurrents. La présente Politique d’utilisation acceptable ne restreint pas les droits conférés par la licence MIT. Elle régit l’utilisation du Service hébergé par Layrix (inscription, site Web layrix.ai, évaluation par des experts, Académie Layrix) et l’utilisation des noms et marques Layrix. Vous ne devez pas :</p><ul><li><strong>Générer de rapports de conformité frauduleux.</strong> Aucune fabrication de documentation visant à tromper des régulateurs, vérificateurs, clients ou tiers.</li><li><strong>Présenter à tort les sorties d’IA comme un avis juridique certifié.</strong> Les sorties de LLLL sont des diagnostics générés par IA, pas des déterminations juridiques.</li><li><strong>Présenter à tort des produits dérivés comme des produits officiels Layrix.</strong> La licence MIT confère des droits sur le code ; elle ne confère pas de droits sur le nom Layrix, le logo, ni les marques « Layrix Academy ». Les forks et œuvres dérivées ne doivent pas impliquer d’endossement, de certification ou d’affiliation avec Caerus Enterprises Inc. sans autorisation écrite préalable.</li><li><strong>Contourner systématiquement les contrôles de sécurité via l’option Guard override.</strong> Les overrides sont pour des exceptions revues, pas pour un contournement de routine.</li><li><strong>Interférer avec les opérations du Service.</strong> Aucune perturbation de l’inscription, des points d’API ou de l’infrastructure du site Web.</li><li><strong>Violer le droit applicable.</strong> Y compris la législation sur la vie privée (LPRPDE, BC PIPA) et la réglementation sur le contrôle des exportations.</li></ul></> },
  { h: 'Utilisation des sorties de LLLL', body: <ul><li>Ne pas présenter les sorties comme des avis juridiques certifiés, des certifications formelles de conformité ou des attestations par un professionnel agréé.</li><li>Lors d’un partage externe, inclure un avertissement clair indiquant que l’analyse a été générée par IA et ne constitue pas un avis juridique.</li><li>Faire examiner les sorties par du personnel qualifié avant de s’appuyer dessus pour des décisions de conformité importantes.</li><li>Ne pas présenter Layrix ou LLLL comme ayant approuvé, certifié ou garanti l’état de conformité de votre projet.</li></ul> },
  { h: 'Service d’évaluation par des experts', body: <ul><li><strong>Conditions d’engagement.</strong> Chaque engagement est régi par des conditions d’engagement distinctes.</li><li><strong>Information exacte.</strong> Toute information trompeuse ou incomplète constitue une violation de la présente AUP.</li><li><strong>Conduite professionnelle.</strong> Un comportement abusif, menaçant ou harcelant envers les évaluateurs entraînera la résiliation de l’engagement et la suspension du compte.</li><li><strong>Limites de portée.</strong> Les demandes hors portée requièrent un engagement distinct.</li></ul> },
  { h: 'Signalement des violations', body: <p>Si vous prenez connaissance d’une utilisation qui viole la présente AUP, signalez-la à <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a>. Les signalements peuvent être soumis de manière anonyme. Nous ne tirerons pas de représailles contre les signaleurs de bonne foi.</p> },
  { h: 'Application', body: <><p>Layrix se réserve le droit d’enquêter et de prendre les mesures appropriées :</p><ul><li>Émission d’un avertissement au titulaire du compte.</li><li>Suspension temporaire de l’accès au Service.</li><li>Résiliation permanente du compte et révocation de l’accès.</li><li>Signalement des violations aux autorités d’application de la loi ou aux autorités de réglementation lorsque requis.</li></ul></> },
  { h: 'Coordonnées', body: <p>Des questions sur la présente AUP ? <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a> · Caerus Enterprises Inc.</p> },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <LegalPage title={<>Politique d’utilisation <span style={{ fontStyle:'italic', color:'var(--accent)' }}>acceptable.</span></>} date="13 mai 2026"
    lang="fr" langHref="/acceptable-use"
    prevailsNotice={<p><strong>Avis :</strong> La présente traduction française est fournie à titre indicatif uniquement. En cas de divergence entre la version française et la version anglaise, la version anglaise prévaut. Consultez la version anglaise officielle à <a className="marq-link" href="/acceptable-use" style={{ color: 'var(--accent)', fontWeight: 500 }}>layrix.ai/acceptable-use</a>.</p>}
    intro={<p>La présente Politique d’utilisation acceptable (« AUP ») régit votre utilisation de la plateforme Layrix et est intégrée par renvoi aux <a className="marq-link" href="/fr/terms" style={{ color: 'var(--accent)', fontWeight: 500 }}>Conditions d’utilisation</a>.</p>}
    sections={sections} />
);
</script>
