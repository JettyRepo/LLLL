<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Académie Layrix · Layrix</title>
<meta name="description" content="L'Académie Layrix aide les membres clés des équipes à obtenir la certification AIGP de l'IAPP — transformant la gouvernance de l'IA d'une connaissance de spécialiste en capacité organisationnelle. Un examen, quatre domaines, conçu pour ceux qui prennent réellement les décisions en matière d'IA." />
<link rel="alternate" hreflang="en" href="https://layrix.ai/academy/" />
<link rel="alternate" hreflang="fr-CA" href="https://layrix.ai/fr/academy/" />
<link rel="alternate" hreflang="x-default" href="https://layrix.ai/academy/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site-shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/site-chrome.jsx"></script>
<script type="text/babel">
const ink='var(--ink)', paper='var(--paper)', paper2='var(--paper-2)', muted='var(--muted)', rule='var(--rule)', accent='var(--accent)', indigo='var(--indigo)';

function Hero() {
  return (
    <section style={{ padding: '88px clamp(20px, 5vw, 56px) 0', textAlign:'center' }}>
      <h1 className="marq-h1" style={{ fontFamily:'var(--display)', fontWeight:500, fontSize:'clamp(48px, 6.4vw, 92px)', lineHeight:1.04, letterSpacing:'-0.04em', margin:'0 auto', maxWidth: 1200 }}>
        Académie Layrix :<br/><span style={{ fontStyle:'italic', color: indigo }}>Du savoir AIGP à la capacité d'équipe.</span>
      </h1>
      <p style={{ fontSize:19, lineHeight:1.6, color:muted, maxWidth: 760, margin:'40px auto 0' }}>
        L'Académie Layrix transforme l'AIGP d'un concept de spécialistes en capacité interne — afin que les membres clés de l'équipe puissent guider l'adoption de l'IA avec plus de clarté, de cohérence et de responsabilité.
      </p>
      <p style={{ fontSize:17, lineHeight:1.65, color:muted, maxWidth: 760, margin:'20px auto 0' }}>
        Bâtie autour du cadre <strong style={{ color: ink }}>Artificial Intelligence Governance Professional</strong> de l'IAPP, elle aide les dirigeants et les équipes transversales à développer une compréhension systématique de la gouvernance, du risque, de la conformité, des contrôles organisationnels et de la supervision du cycle de vie de l'IA.
      </p>
      <div style={{ display:'flex', gap:12, justifyContent:'center', marginTop: 40, flexWrap:'wrap' }}>
        <a className="marq-cta marq-link" href="/fr/academy/buy/" style={{ padding:'16px 28px', background:ink, color:paper, fontSize:14, fontWeight:500, borderRadius:999 }}>Commencer — 20 $US →</a>
        <a className="marq-cta marq-link" href="#programs" style={{ padding:'16px 28px', border:`1px solid ${ink}`, color:ink, fontSize:14, fontWeight:500, borderRadius:999 }}>Voir tous les programmes →</a>
      </div>
    </section>
  );
}

function Exam() {
  const stats = [['100','Questions'],['180','Minutes'],['4','Domaines'],['~30 %','Scénarios']];
  const rows = [
    ['I', "Fondements de la gouvernance de l'IA", '16–20'],
    ['II', 'Lois, normes et cadres de conformité', '19–23'],
    ['III', "Gouverner le processus de développement de l'IA", '21–25'],
    ['IV', "Gouverner le déploiement et l'usage de l'IA", '21–25'],
  ];
  return (
    <SectionRow idx="01" kicker="La certification AIGP" tone={indigo}
      title={<>Un examen. <span style={{ fontStyle:'italic', color: indigo }}>Quatre domaines de gouvernance.</span></>}
      lead="La certification Artificial Intelligence Governance Professional de l'IAPP est un examen linéaire de 100 items en 180 minutes, sur quatre domaines. Environ 30 % de questions de mise en situation. Le BoK v2.1.0 est entré en vigueur le 2 février 2026 — il met l'accent sur les architectures agentiques, le risque tiers et le renforcement de la gouvernance des données.">
      <div className="marq-grid-4" style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 14, marginTop: 56 }}>
        {stats.map(([n,l]) => (
          <div key={l} className="marq-card" style={{ background: paper2, padding:'28px 22px', borderRadius:14, border:`1px solid ${rule}`, textAlign:'center' }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 56, fontWeight: 500, color: indigo, letterSpacing:'-0.03em' }}>{n}</div>
            <div className="marq-kicker" style={{ marginTop: 6 }}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 32, border: `1px solid ${ink}`, borderRadius: 14, overflow:'hidden' }}>
        <div style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'14px 24px', background: ink, color: paper, fontSize: 12, letterSpacing:'0.16em', textTransform:'uppercase', fontFamily:'var(--mono)' }}>
          <div>Domaine</div><div>Thème</div><div style={{ textAlign:'right' }}>Items notés</div>
        </div>
        {rows.map(([d,t,s], i) => (
          <div key={d} style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'18px 24px', alignItems:'center', borderTop: i ? `1px solid ${rule}` : 'none', background: paper2 }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500 }}>{d}</div>
            <div style={{ fontSize: 15, color: ink }}>{t}</div>
            <div style={{ textAlign:'right', fontFamily:'var(--mono)', fontSize: 13, color: indigo, fontWeight: 600 }}>{s}</div>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function WhyOrg() {
  return (
    <SectionRow idx="02" kicker="Pourquoi votre équipe en a besoin" tone={indigo}
      title={<>La gouvernance de l'IA <span style={{ fontStyle:'italic', color: indigo }}>{"n'est pas qu'une question informatique."}</span></>}>
      <div style={{ maxWidth: 840, marginTop: 48 }}>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted }}>
          L'IA est adoptée dans les services juridiques, conformité, produit, opérations et approvisionnement — pas seulement en ingénierie. Chacune de ces fonctions porte une exposition au risque réelle : approuver un modèle sans comprendre sa traçabilité des données, déployer un outil sans connaître les obligations réglementaires applicables, ou auditer le système d'IA d'un fournisseur sans cadre d'évaluation commun. La certification AIGP donne aux personnes qui prennent ces décisions un ancrage systématique dans ce dont elles sont réellement responsables.
        </p>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted, marginTop: 28 }}>
          La certification crée un vocabulaire commun entre les équipes. Quand un chef de produit, un conseiller en vie privée et un responsable de la conformité comprennent tous les quatre mêmes domaines — fondements de la gouvernance IA, lois et normes, gouvernance du développement et supervision du déploiement — les initiatives IA avancent plus vite et atterrissent mieux. Les décisions qui nécessitaient autrefois une escalade sont prises au bon niveau, avec le bon contexte, par des personnes qui partagent la même carte.
        </p>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted, marginTop: 28 }}>
          Une certification, quatre domaines, un référentiel — mis à jour pour l'ère de l'IA agentique (BoK v2.1.0, en vigueur depuis février 2026). Pour les organisations qui bâtissent une capacité de gouvernance IA, l'AIGP est le chemin le plus direct de la prise de conscience à la compétence vérifiée et certifiée par examen.
        </p>
      </div>
    </SectionRow>
  );
}

function Programs() {
  return (
    <SectionRow idx="03" kicker="Programmes" tone={indigo}
      title={<>Une certification à la fois, <span style={{ fontStyle:'italic', color: indigo }}>conçue pour durer.</span></>}>
      <div id="programs" className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: 16, marginTop: 56 }}>
        <div className="marq-card" style={{ background: ink, color: paper, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14, display:'flex', flexDirection:'column' }}>
          <div className="marq-kicker" style={{ color: accent }}>PARCOURS AIGP · BoK 2.1.0</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 32, fontWeight: 500, marginTop: 16, lineHeight: 1.1, letterSpacing:'-0.02em' }}>JC AIGP Quick Pass Guide</h3>
          <p style={{ fontSize: 15, lineHeight: 1.65, color: 'rgba(241,239,231,0.75)', marginTop: 16 }}>
            Un système d'apprentissage multimodal pour la certification AIGP de l'IAPP — 500+ points de connaissance sur six systèmes d'apprentissage interconnectés. Conférences narrées, guide d'étude, essentiels d'examen, banque de questions, fiches mémoire et antisèche. Plus un tuteur IA autoconfiguré en option (licence MIT).
          </p>
          <ul style={{ listStyle:'none', padding: 0, marginTop: 24, display:'grid', gap: 8 }}>
            {["Six systèmes d'apprentissage · 500+ KP", "Tuteur IA personnel (optionnel, gratuit)", "Un an de mises à jour du contenu"].map(b => (
              <li key={b} style={{ display:'grid', gridTemplateColumns:'18px 1fr', gap: 10, fontSize: 14, color: 'rgba(241,239,231,0.85)' }}>
                <span style={{ color: accent, fontWeight: 700 }}>✓</span><span>{b}</span>
              </li>
            ))}
          </ul>
          <div style={{ marginTop: 28, fontSize: 13, color: 'rgba(241,239,231,0.6)', fontFamily:'var(--mono)', letterSpacing:'0.06em' }}>
            200 $US / personne · Commencez avec 20 $US
          </div>
          <a className="marq-cta marq-link" href="/fr/academy/buy/" style={{ marginTop: 20, display:'inline-block', padding:'16px 28px', background: accent, color: paper, fontSize: 14, fontWeight: 500, borderRadius: 999, textAlign:'center' }}>{"S'inscrire — 20 $US →"}</a>
        </div>
        <div className="marq-card" style={{ background: paper2, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14, border: `1px solid ${rule}`, display:'flex', flexDirection:'column', opacity: 0.75 }}>
          <div className="marq-kicker" style={{ color: muted }}>PARCOURS CIPP · À venir 2026</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 32, fontWeight: 500, marginTop: 16, lineHeight: 1.1, letterSpacing:'-0.02em', color: muted }}>JC CIPP Quick Pass Guide</h3>
          <p style={{ fontSize: 15, lineHeight: 1.65, color: muted, marginTop: 16 }}>
            Préparation complète pour la certification Certified Information Privacy Professional de l'IAPP. Même format — guide d'étude, banque de questions, essentiels, antisèche — conçu pour le droit de la vie privée et le référentiel CIPP.
          </p>
          <p style={{ fontSize: 13, color: muted, marginTop: 'auto', paddingTop: 40, fontStyle:'italic' }}>
            {"Lancement en 2026. Inscrivez votre intérêt et nous vous informerons à l'ouverture des inscriptions."}
          </p>
          <span style={{ marginTop: 16, display:'inline-block', padding:'14px 24px', background: rule, color: muted, fontSize: 14, fontWeight: 500, borderRadius: 999, textAlign:'center', cursor:'default' }}>Bientôt disponible</span>
        </div>
      </div>
    </SectionRow>
  );
}

function Fit() {
  const fit = [
    ["Juristes, responsables conformité et conseillers vie privée qui donnent des avis sur l'IA.", "Pas seulement les techniciens. Ceux qui signent les autorisations d'outils IA, examinent les contrats fournisseurs et répondent aux questions réglementaires."],
    ["Chefs de produit et responsables de programme supervisant des systèmes IA.", "Ceux qui définissent les exigences, approuvent les déploiements et sont responsables des décisions produit qui façonnent l'utilisation de l'IA."],
    ["Ingénieurs seniors et architectes qui intègrent l'IA aux produits.", "Les contributeurs techniques qui doivent comprendre les contraintes de gouvernance en même temps que l'implémentation — et pas seulement les préoccupations techniques."],
    ["Dirigeants bâtissant des cadres internes de gouvernance IA.", "Cadres supérieurs qui doivent poser les bonnes questions, répartir les risques et créer des structures de responsabilité autour de l'IA."],
  ];
  return (
    <SectionRow idx="04" kicker="Qui devrait se certifier ?" tone={indigo}
      title={<>Les bonnes personnes, <span style={{ fontStyle:'italic', color: indigo }}>pas seulement les plus évidentes.</span></>}>
      <div className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: '14px 32px', marginTop: 48 }}>
        {fit.map(([h, b]) => (
          <div key={h} style={{ padding: '24px 0', borderTop: `1px solid ${rule}` }}>
            <h4 style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, marginBottom: 8 }}>{h}</h4>
            <p style={{ fontSize: 14.5, color: muted, lineHeight: 1.6 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function App() {
  return (
    <>
      <Header current="aigp" lang="fr" langHref="/academy/" />
      <Hero />
      <Exam />
      <WhyOrg />
      <Programs />
      <Fit />
      <Footer lang="fr" extra={<p style={{ marginTop: 24, fontSize: 11, color: muted, lineHeight: 1.65, maxWidth: 720 }}>{"AIGP® et IAPP® sont des marques de l'International Association of Privacy Professionals. Layrix est indépendante et n'est pas affiliée, soutenue, ni commanditée par l'IAPP."}</p>} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
