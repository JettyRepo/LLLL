<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="alternate" hreflang="en" href="https://layrix.ai/" />
  <link rel="alternate" hreflang="fr-CA" href="https://layrix.ai/fr/" />
  <link rel="alternate" hreflang="x-default" href="https://layrix.ai/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --paper: #f1efe7;
      --paper-2: #fffefa;
      --ink: #161614;
      --muted: rgba(22,22,20,0.62);
      --rule: rgba(22,22,20,0.12);
      --accent: #2f6f4a;
      --display: 'Fraunces', 'Tiempos Headline', Georgia, serif;
      --sans: 'Inter Tight', -apple-system, system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--paper); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .marq-link { text-decoration: none; }
    .marq-link:hover { color: var(--accent); }
    .marq-cta { transition: transform .12s ease, background .15s ease, color .15s ease; }
    .marq-cta:hover { transform: translateY(-1px); }
    .marq-card { transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .marq-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(22,22,20,0.06); border-color: rgba(22,22,20,0.22); }
    .marq-strip { animation: stripScroll 38s linear infinite; }
    @keyframes stripScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      .marq-strip { animation: none; }
      .marq-dot { animation: none !important; }
    }
    .marq-dot { animation: marqDot 2.4s ease-in-out infinite; }
    @keyframes marqDot { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.4; } }
    h1, h2, h3 { letter-spacing: -0.03em; }
    nav a { white-space: nowrap; }
    .marq-underline { background-image: linear-gradient(to top, var(--accent) 0, var(--accent) 4px, transparent 4px); background-repeat: no-repeat; background-size: 100% 100%; background-position: 0 0.08em; padding-bottom: 0.08em; }
    ::selection { background: var(--accent); color: var(--paper); }
    @media (max-width: 900px) {
      .marq-grid-3 { grid-template-columns: 1fr !important; }
      .marq-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
      .marq-section-row { grid-template-columns: 1fr !important; }
      .marq-section-row > div:first-child { font-size: 80px !important; }
      .marq-h2 { font-size: 44px !important; }
      .marq-h1 { font-size: 60px !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>

        <rect x="0" y="288" width="96" height="32" fill="#d97757"/><rect x="96" y="288" width="96" height="32" fill="#0a0a0a"/><rect x="192" y="288" width="32" height="32" fill="#d97757"/><rect x="224" y="288" width="96" height="32" fill="#0a0a0a"/><rect x="320" y="288" width="32" height="32" fill="#d97757"/><rect x="352" y="288" width="96" height="32" fill="#0a0a0a"/><rect x="448" y="288" width="32" height="32" fill="#d97757"/><rect x="480" y="288" width="96" height="32" fill="#0a0a0a"/><rect x="576" y="288" width="96" height="32" fill="#d97757"/>

function Hero() {

function SectionRow({ idx, kicker, title, lead, children }) {
  return (
    <section style={{ padding: '120px clamp(20px, 5vw, 56px) 0', maxWidth: 1400, margin: '0 auto' }}>
      <div className="marq-section-row" style={{ display: 'grid', gridTemplateColumns: '180px 1fr', gap: 40, alignItems: 'start' }}>
        <div style={{ fontFamily: 'var(--display)', fontSize: 140, lineHeight: 0.85, fontWeight: 400, color: accent, fontStyle: 'italic' }}>{idx}</div>
        <div>
          <div style={{ fontFamily: 'var(--mono)', fontSize: 11, color: muted, letterSpacing: '0.2em', textTransform: 'uppercase' }}>{kicker}</div>
          <h2 className="marq-h2" style={{ fontFamily: 'var(--display)', fontWeight: 500, fontSize: 'clamp(40px, 5vw, 72px)', lineHeight: 0.96, marginTop: 14, maxWidth: 1000 }}>{title}</h2>
          {lead && <p style={{ fontSize: 17, lineHeight: 1.6, color: muted, maxWidth: 760, marginTop: 28 }}>{lead}</p>}
        </div>
      </div>
      {children}
    </section>
  );
}

function LLLLDemo() {
  return (

      title={<>Voyez le moteur <span style={{ fontStyle: 'italic', color: accent }}>à l’œuvre.</span></>}

}

function Gap() {
  const items = [

    ['La revue arrive toujours à la fin', 'Évaluations manuelles. Engagements de 5 000 $ à 500 000 $. Délais lents. Conçus pour une époque où livrer du logiciel était difficile.'],
  ];
  return (
    <SectionRow idx="01" kicker="L’écart"
      title={<>La production de logiciel a changé. <span style={{ color: muted }}>La conformité, non.</span></>}
      lead="Un développeur, une petite équipe, ou même un agent IA peuvent livrer plus vite que jamais. La plupart des équipes traitent encore la conformité comme un problème de fin de cycle — qui ne refait surface qu’au moment de la due diligence, des demandes clients ou des objections réglementaires. À ce stade, ce n’est plus de la guidance. C’est de la reprise.">

        {items.map(([h, b], i) => (
          <div key={h} className="marq-card" style={{ background: paper2, padding: '32px 26px', borderRadius: 14, border: `1px solid ${rule}` }}>
            <div style={{ fontFamily: 'var(--display)', fontSize: 56, lineHeight: 1, color: accent, fontWeight: 500 }}>{String(i + 1).padStart(2, '0')}</div>
            <h3 style={{ fontFamily: 'var(--display)', fontSize: 26, fontWeight: 500, marginTop: 24, lineHeight: 1.15 }}>{h}</h3>
            <p style={{ fontSize: 14.5, lineHeight: 1.6, color: muted, marginTop: 12 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

      cta: 'S’inscrire à l’Académie', href: '/fr/academy/buy/', tone: '#3a4a6b',
    },
  ];
  return (
    <SectionRow idx="02" kicker="La couche"
      title={<>Une couche. <span style={{ fontStyle: 'italic', color: accent }}>Trois moteurs.</span></>}

function Why() {
  const items = [

        {items.map(([h, b], i) => (
          <div key={h} style={{ padding: '36px 26px', borderRight: `1px solid rgba(255,255,255,0.1)` }}>
