<div id="root"></div>

<script type="text/babel">
const sections = [
  { h: "What Information We Collect (And What We Don't)", body: <><p>We only collect the information necessary to provide and improve our platform and the Services.</p><h3>What we collect</h3><ul><li><strong>Account Information:</strong> Your name and email address.</li><li><strong>Login Data:</strong> The credentials used to access our platform.</li><li><strong>Course Usage &amp; Performance Data:</strong> For our AI-Generated Courses, we may collect your purchase history and subscription status.</li><li><strong>Feedback:</strong> Any comments, reviews, or suggestions you share with us.</li><li><strong>Device Information:</strong> When you log in, we record a device identifier to manage your active sessions and prevent unauthorized sharing of your account.</li><li><strong>Email Preferences:</strong> Whether you have consented to receive communications from us, and the date of that consent.</li><li><strong>Invoice/Receipt:</strong> For billing and invoicing purposes, we and our payment processors collect your billing name, address, and email address.</li></ul><h3>What we do NOT collect</h3><ul><li>We do not intend to collect or store any sensitive personal information or medical data.</li><li>We do not collect full credit card numbers; all payments are processed securely through our payment processors.</li><li><strong>Client Documents:</strong> We do not save the documents, code, or business plans you provide for AI compliance review.</li></ul><p>Please do not submit sensitive personal information (such as health records, government-issued identification numbers, or financial account credentials) to our platform. If such information is inadvertently submitted, we will delete it upon becoming aware of it.</p></> },
  { h: 'Legal Basis for Processing Data', body: <><p>Under privacy laws like the GDPR, we must have a "legal basis" for using your data:</p><ul><li>Account and billing information is processed to perform our contract with you.</li><li>Course usage data and service improvement are based on our legitimate business interests in operating and improving the platform.</li><li>Marketing communications, if any, are based on your consent, which you may withdraw at any time.</li></ul></> },
  { h: 'How We Store and Process Your Data', body: <><p><strong>Local Servers in Canada:</strong> All account data collected by our platform is securely stored on our local servers located in Canada. Payment information and transactional emails are processed by our data processors, which are contractually bound to protect your data.</p><p><strong>User Local Storage:</strong> All output documents (such as generated AI Impact Assessments or corrected policies) are saved exclusively by you to your local computer or your own cloud space.</p></> },
  { h: 'International Data Transfers', body: <p>Your account data is stored in Canada, which is recognized by the European Commission as providing an adequate level of data protection. For transfers to our service providers in the United States or other countries, we ensure appropriate safeguards are in place, including Standard Contractual Clauses, certification under the EU-US Data Privacy Framework, or other lawful transfer mechanisms.</p> },
  { h: "Children's Privacy", body: <p>Our platform is intended for adult users only. You must be an adult under the laws of your jurisdiction to register or use our Services. To protect minors, (a) we do not knowingly collect personal information from minors; (b) you must not submit personal information of minors through our Services; and (c) if we become aware that any such information has been collected or submitted, we will delete it.</p> },
  { h: 'Payments and Refunds', body: <><p>Some of our services are free, while others are paid through our payment processors.</p><ul><li><strong>Courses:</strong> $20 is due upon order, refundable within 30 calendar days of payment. The balance is automatically charged on day 31. Times are calculated in UTC, in accordance with the timestamps recorded by our payment service provider.</li><li><strong>Other Services:</strong> All other paid services (such as AI compliance reviews and expert services) are non-refundable.</li></ul></> },
  { h: 'How We Share Your Information', body: <><p>We do not sell your personal information. We only share your data in limited situations:</p><ul><li><strong>Service Providers:</strong> We share necessary data with trusted third parties that help run our business, such as payment processors and email service providers. These providers are contractually bound to protect your data and may only use it to provide services on our behalf.</li><li><strong>Human Experts:</strong> If you request human compliance expert review services, relevant information will be shared with them to facilitate the service.</li><li><strong>Legal Requirements:</strong> We may disclose information if required by law or legal processes in Canada or other relevant jurisdictions.</li></ul></> },
  { h: 'Your Privacy Rights', body: <><p>Depending on your location, you may have the following rights regarding your personal data:</p><ul><li><strong>Access:</strong> Request a copy of the personal information we hold about you.</li><li><strong>Correction:</strong> Ask us to correct inaccurate or incomplete personal information.</li><li><strong>Deletion:</strong> Request permanent deletion of your personal information.</li><li><strong>Restriction:</strong> Ask us to limit how we process your personal data in certain circumstances.</li><li><strong>Portability:</strong> Receive your data in a structured, machine-readable format.</li><li><strong>Objection:</strong> Object to our processing of your personal data based on legitimate interests.</li><li><strong>Withdraw Consent:</strong> Opt out of consent-based processing at any time.</li><li><strong>Complaint:</strong> Lodge a complaint with your local data protection authority, such as the Office of the Privacy Commissioner of Canada (priv.gc.ca) or the relevant EU supervisory authority.</li><li>Other rights as provided under applicable laws.</li></ul></> },
  { h: 'How to Exercise Your Rights', body: <p>You can update your account details directly in our platform settings. For all other requests, please contact us via email at <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a>. We will use reasonable efforts to respond to and process all valid privacy rights requests as soon as possible, but no later than 15 working days.</p> },
  { h: 'Data Retention', body: <p>We retain your personal information only for as long as your account is active or as necessary to provide our Services, comply with our legal obligations, resolve disputes, and enforce our agreements. Once no longer needed, your data is securely deleted or anonymized.</p> },
  { h: 'Data Security', body: <p>We protect your personal information through encryption in transit (TLS) and at rest, access controls limiting access to authorized personnel, and data processing agreements with all service providers.</p> },
  { h: 'Cookies and Local Storage', body: <p>We do not use HTTP cookies for tracking or advertising. To provide our Services, we use functional browser storage (such as localStorage) to maintain your login session and support platform features. This data is stored locally on your device and is not used for tracking. You can clear it at any time through your browser settings.</p> },
  { h: 'Automated Processing and AI', body: <p>Our Products and Services use AI to generate compliance review summaries, course content, and similar reference compliance materials. These outputs are intended as informational references for you and do not constitute automated decisions about individual data subjects.</p> },
  { h: 'Updates to This Policy', body: <p>We may update this Privacy Policy from time to time to reflect changes in our platform, the Services, or legal requirements. If we make significant changes, we will notify you by email or by placing a notice on our platform. Your continued use of our platform after such updates constitutes your acceptance of the updated Privacy Policy. If you do not agree to any changes, please discontinue use of our platform and the Services.</p> },
  { h: 'Contact Us', body: <><p>If you have any questions or requests regarding your personal information, please contact our Privacy Officer:</p><p><strong>Privacy Officer:</strong> Joanna C.<br /><strong>Email:</strong> <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a></p><p><strong>EU/UK Representative:</strong> We are in the process of appointing a representative in the European Union and United Kingdom as required under applicable data protection law.</p></> },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <LegalPage title={<>Privacy <span style={{ fontStyle:'italic', color:'var(--accent)' }}>Policy.</span></>} date="June 8, 2026 · Version 5.2" langHref="/fr/privacy"
    intro={<p>At CAERUS ENTERPRISES INC. (the "Company" or "We"), we are committed to protecting your privacy. We are an AI compliance platform that provides services such as AI-driven reviews of AI product code, AI product design, related legal documents and AI compliance related assessments, as well as AI compliance courses and access to human compliance experts (collectively, the "Services"). This Privacy Policy explains in plain language what information we collect, how we use it, and the rights you have regarding your personal data.</p>}
    sections={sections} />
);
</script>
