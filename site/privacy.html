<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Privacy Policy · Layrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site-shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/site-chrome.jsx"></script>
<script type="text/babel" src="/legal-shared.jsx"></script>
<script type="text/babel">
const sections = [
  { h: 'Introduction', body: <><p>Caerus Enterprises Inc. ("Layrix") is committed to protecting your privacy. This Privacy Policy explains how we collect, use, store, and disclose information when you use the Layrix platform.</p><p>We operate under the Personal Information Protection and Electronic Documents Act (PIPEDA) and the British Columbia Personal Information Protection Act (BC PIPA).</p></> },
  { h: 'Information We Collect', body: <><h3>Registration Information</h3><p>When you register for a Layrix account, we collect your email address. This is the only personal information required for registration. We do not collect names, phone numbers, or physical addresses during registration.</p><h3>Local Compliance Data</h3><p>LLLL operates locally within your Claude Code environment. <strong>No compliance data, source code, analysis results, or project files are transmitted to Layrix servers.</strong> LLLL Guard likewise runs locally.</p><h3>Browser Local Storage</h3><p>The Layrix website stores a theme preference in your browser's localStorage. This data is stored locally and is not transmitted to our servers.</p><h3>Human Expert Review Service</h3><p>If you submit a request for Human Expert Review, the content of your request is transmitted to and accessible by the Layrix review team. We treat all review request materials as confidential.</p></> },
  { h: 'How We Use Information', body: <><p>We use the information we collect for the following purposes:</p><ul><li><strong>Account management.</strong> Create and maintain your account, authenticate access, and manage your registration.</li><li><strong>Service delivery.</strong> Provide features you have requested, including full findings visibility for registered users and Human Expert Review services.</li><li><strong>Communication.</strong> Send service-related notifications, respond to support requests, and provide updates about material changes.</li><li><strong>Improvement.</strong> Analyze aggregate, anonymized usage patterns to improve the Service. We do not use individual compliance analysis data for this purpose, because that data never reaches us — it stays on your machine and goes only to the LLM you have already chosen to use.</li></ul><p>We do not sell, rent, or trade your personal information to third parties. We do not use your information for advertising purposes.</p></> },
  { h: 'Data Storage', body: <><p>Registration data is stored in Cloudflare D1, a serverless SQL database. Data is encrypted at rest and in transit.</p><p>Compliance analysis data generated by LLLL and Guard is processed on your local machine and (when AI analysis is requested) goes only to the LLM provider you have configured. Layrix does not store, process, or have access to your compliance scan results, source code, or project files.</p></> },
  { h: 'Third-Party Services', body: <ul><li><strong>Cloudflare.</strong> Website hosting, DNS, CDN, and database services (Cloudflare D1).</li><li><strong>Resend.</strong> Transactional email delivery for account-related communications.</li><li><strong>Stripe.</strong> Payment processing. Layrix does not store credit card numbers or payment credentials.</li></ul> },
  { h: 'Your Rights under PIPEDA & BC PIPA', body: <><p>Under Canadian federal and British Columbia provincial privacy legislation, you have the following rights:</p><ul><li><strong>Access.</strong> Request access to the personal information we hold about you. We respond within 30 days.</li><li><strong>Correction.</strong> Request correction of any inaccurate or incomplete personal information.</li><li><strong>Deletion.</strong> Request deletion of your personal information.</li><li><strong>Withdrawal of consent.</strong> Withdraw consent at any time, subject to legal or contractual restrictions.</li><li><strong>Complaint.</strong> File a complaint with the OPC of Canada or the OIPC for British Columbia.</li></ul><p>To exercise these rights, contact us at <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a>.</p></> },
  { h: "Children's Privacy", body: <p>The Service is not directed at individuals under the age of 13. We do not knowingly collect personal information from children under 13.</p> },
  { h: 'Data Retention', body: <><p>We retain account data for as long as your account remains active. If you request account deletion, we will delete your personal information within 30 days, except where retention is required by law.</p><p>Human Expert Review engagement materials are retained for the duration of the engagement plus 12 months for quality assurance and dispute resolution, after which they are securely deleted.</p></> },
  { h: 'Security', body: <ul><li>Encryption in transit using TLS for all communications.</li><li>Encryption at rest for stored data in Cloudflare D1.</li><li>Access controls limiting access to authorized personnel.</li><li>Regular review of security practices and provider posture.</li></ul> },
  { h: 'Changes to This Policy', body: <p>We may update this Privacy Policy from time to time. Material changes will be communicated via email to registered users or by posting a prominent notice on the website.</p> },
  { h: 'Contact', body: <p>Questions about this Privacy Policy? <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a> · Caerus Enterprises Inc.</p> },
];
ReactDOM.createRoot(document.getElementById('root')).render(
  <LegalPage title={<>Privacy <span style={{ fontStyle:'italic', color:'var(--accent)' }}>Policy.</span></>} date="April 1, 2026" sections={sections} />
);
</script>
</body>
</html>
