  { h: 'Purpose and Scope', body: <><p>We provide AI compliance tools and related services to help users identify and address compliance gaps in AI products and operations. This AUP establishes guidelines for responsible use so that the Services remain reliable, trustworthy, and beneficial for all users.</p><p>This AUP governs your use of the Services, including the Hosted Services, Layrix Academy Materials, and AI-Generated Outputs. Your use of the Open Source Software is governed by the open-source license published with the Open Source Software. This AUP does not restrict the rights granted by that open-source license, but it does govern any use of our names, marks, or Hosted Services in connection with the Open Source Software.</p></> },
  { h: 'Prohibited Uses', body: <><p>You must not, and must not permit others to:</p><h3>Fraud and misrepresentation</h3><ul><li>Generate or distribute fraudulent compliance reports or fabricate documentation to deceive regulators, auditors, customers, investors, or other third parties.</li><li>Misrepresent AI-Generated Outputs as legal advice, formal compliance certifications, attestations by a licensed professional, or determinations by us. We are not a law firm, and AI-Generated Outputs are reference materials only.</li><li>Misrepresent forks or derivative works of the Open Source Software as our official products, or use our name or marks in a way that implies endorsement, certification, or affiliation with us without our prior written permission.</li><li>Make false or misleading representations to us or to third parties in connection with the Services or AI-Generated Outputs.</li></ul><h3>Content prohibitions</h3><ul><li>Submit User Content containing state secrets, personal information of minors, or any data whose disclosure, export, or processing is restricted or prohibited under the law of your jurisdiction.</li><li>Submit User Content that infringes any intellectual property, privacy, publicity, or other rights of any third party.</li><li>Submit sensitive personal information (such as health records, government-issued identification numbers, or financial account credentials).</li></ul><h3>Misuse of Services</h3><ul><li>Interfere with the operation of the Services, such as by disrupting registration, API endpoints, website infrastructure, or our payment systems.</li><li>Systematically bypass security, compliance, or access controls of any Service.</li><li>Redistribute, resell, sublicense, or make the Hosted Services available to any third party, in whole or in part.</li><li>Use the Services in violation of applicable law, such as privacy legislation, export control regulations, or sanctions regimes.</li></ul><h3>Account and payment misuse</h3><ul><li>Use the   { h: 'AI-Generated Outputs Usage', body: <><p>AI-Generated Outputs are reference materials only. When you use or share AI-Generated Outputs:</p><ul><li>Do not present AI-Generated Outputs as legal opinions, formal compliance certifications, or attestations by a licensed professional.</li><li>When sharing AI-Generated Outputs externally, include a clear disclaimer that the output was AI-generated and does not constitute legal advice.</li><li>Have AI-Generated Outputs reviewed by qualified professionals before relying on them for material compliance decisions.</li><li>Do not represent us as having endorsed, certified, or guaranteed the compliance status of any product, document, or organization based on AI-Generated Outputs.</li></ul></> },
  { h: 'Layrix Academy Materials Usage', body: <><p>Materials are licensed to you for your own personal study or preparation for the relevant examination. When you use Materials:</p><ul><li>Do not redistribute, resell, sublicense, or publicly post the Materials, in whole or in part.</li><li>Do not remove, alter, or obscure any watermarks or other identifying markings on the Materials.</li><li>Respect the device and download limits applicable to your purchase, as shown at the time of purchase.</li><li>Do not share your Account credentials or otherwise enable others to access the Materials under your license.</li></ul></> },
  { h: 'Reporting Violations', body: <p>If you become aware of any use of the Services that violates this AUP, please report it to <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a>. Reports may be submitted anonymously. We do not retaliate against users who report violations in good faith.</p> },
  { h: 'Enforcement', body: <><p>We may investigate any suspected violation of this AUP and, at our sole discretion, take any action we consider appropriate, such as:</p><ul><li>issuing a warning to the user;</li><li>temporarily suspending access to all or any part of the Services;</li><li>permanently terminating the user's Account and revoking access;</li><li>removing or refusing to deliver any AI-Generated Outputs or Materials connected to the violation; or</li><li>reporting the violation to law enforcement, regulatory authorities, or other competent authorities.</li></ul><p>Failure to comply with this AUP is a material breach of the Terms. Violations may also trigger your indemnification obligations under Section 15 of the Terms.</p></> },
  { h: 'Updates to This Policy', body: <p>We may update this AUP from time to time. If we make material changes, we may notify you by email to the address associated with your Account or by posting a notice on the Services. Your continued use of the Services after the effective date of the updated AUP constitutes your acceptance of the changes. If you do not agree to the updated AUP, you must stop using the Services.</p> },
