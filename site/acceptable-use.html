const sections = [
  { h: 'Purpose', body: <p>Layrix provides compliance analysis tools designed to help development teams identify and address compliance gaps in AI-built software. This policy establishes guidelines for responsible use so that the Service remains reliable, trustworthy, and beneficial for all users.</p> },
  { h: 'Prohibited Uses', body: <><p>The Software — the LLLL skill, Guard CLI, compliance checklists, scoring methodologies, scan and guard patterns, and associated documentation — is MIT-licensed. You are free to use, modify, fork, and redistribute it, including for commercial purposes and including to build competing products. This Acceptable Use Policy does not restrict the rights granted by the MIT License. It governs use of the Layrix-hosted Service (registration, the layrix.ai website, Human Expert Review, Layrix Academy) and use of Layrix names and marks. You must not:</p><ul><li><strong>Generate fraudulent compliance reports.</strong> No fabricating documentation to deceive regulators, auditors, customers, or third parties.</li><li><strong>Misrepresent AI output as certified legal advice.</strong> LLLL outputs are AI-generated diagnostics, not legal determinations.</li><li><strong>Misrepresent derivatives as official Layrix products.</strong> The MIT License grants rights to the code; it does not grant rights to the Layrix name, logo, or "Layrix Academy" marks. Forks and derivative works must not imply endorsement, certification, or affiliation with Caerus Enterprises Inc. without prior written permission.</li><li><strong>Systematically bypass security controls via Guard override.</strong> Overrides are for reviewed exceptions, not routine bypass.</li><li><strong>Interfere with Service operations.</strong> No disrupting registration, API endpoints, or website infrastructure.</li><li><strong>Violate applicable law.</strong> Including privacy legislation (PIPEDA, BC PIPA) and export control regulations.</li></ul></> },
  { h: 'LLLL Output Usage', body: <ul><li>Do not present outputs as certified legal opinions, formal compliance certifications, or attestations by a licensed professional.</li><li>When sharing externally, include a clear disclaimer indicating that the analysis was AI-generated and does not constitute legal advice.</li><li>Have outputs reviewed by qualified personnel before relying on them for material compliance decisions.</li><li>Do not represent Layrix or LLLL as having endorsed, certified, or guaranteed your project's compliance status.</li></ul> },
  { h: 'Human Expert Review Service', body: <ul><li><strong>Engagement terms.</strong> Each engagement is governed by separate engagement terms.</li><li><strong>Accurate information.</strong> Misleading or incomplete information violates this AUP.</li><li><strong>Professional conduct.</strong> Abusive, threatening, or harassing behavior toward reviewers will result in termination of the engagement and account suspension.</li><li><strong>Scope limitations.</strong> Out-of-scope requests require a separate engagement.</li></ul> },
  { h: 'Reporting Violations', body: <p>If you become aware of any use that violates this AUP, report it to <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a>. Reports may be submitted anonymously. We will not retaliate against good-faith reporters.</p> },
  { h: 'Enforcement', body: <><p>Layrix reserves the right to investigate and take appropriate action:</p><ul><li>Issuing a warning to the account holder.</li><li>Temporarily suspending access to the Service.</li><li>Permanently terminating the account and revoking access.</li><li>Reporting violations to law enforcement or regulatory authorities where required.</li></ul></> },
  { h: 'Contact', body: <p>Questions about this AUP? <a className="marq-link" href="mailto:info@layrix.ai" style={{ color: 'var(--accent)' }}>info@layrix.ai</a> · Caerus Enterprises Inc.</p> },
];
