<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layrix Academy · Layrix</title>
<meta name="description" content="Layrix Academy helps key team members earn the IAPP AIGP credential — turning AI governance from specialist knowledge into an organizational capability. One exam, four domains, built for the people who actually make AI decisions." />
<link rel="alternate" hreflang="en" href="https://layrix.ai/academy/" />
<link rel="alternate" hreflang="fr-CA" href="https://layrix.ai/fr/academy/" />
<link rel="alternate" hreflang="x-default" href="https://layrix.ai/academy/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site-shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/site-chrome.jsx"></script>
<script type="text/babel">
const ink='var(--ink)', paper='var(--paper)', paper2='var(--paper-2)', muted='var(--muted)', rule='var(--rule)', accent='var(--accent)', indigo='var(--indigo)';

function Hero() {
  return (
    <section style={{ padding: '88px clamp(20px, 5vw, 56px) 0', textAlign:'center' }}>
      <h1 className="marq-h1" style={{ fontFamily:'var(--display)', fontWeight:500, fontSize:'clamp(48px, 6.4vw, 92px)', lineHeight:1.04, letterSpacing:'-0.04em', margin:'0 auto', maxWidth: 1200 }}>
        Layrix Academy:<br/><span style={{ fontStyle:'italic', color: indigo }}>From AIGP Knowledge to Team Capability.</span>
      </h1>
      <p style={{ fontSize:19, lineHeight:1.6, color:muted, maxWidth: 760, margin:'40px auto 0' }}>
        Layrix Academy turns AIGP from a specialist concept into an internal capability — so key team members can guide AI adoption with more clarity, consistency, and responsibility.
      </p>
      <p style={{ fontSize:17, lineHeight:1.65, color:muted, maxWidth: 760, margin:'20px auto 0' }}>
        Built around the IAPP's <strong style={{ color: ink }}>Artificial Intelligence Governance Professional</strong> framework, it helps leaders and cross-functional teams develop a systematic understanding of AI governance, risk, compliance, organizational controls, and lifecycle oversight.
      </p>
      <div style={{ display:'flex', gap:12, justifyContent:'center', marginTop: 40, flexWrap:'wrap' }}>
        <a className="marq-cta marq-link" href="/academy/buy/" style={{ padding:'16px 28px', background:ink, color:paper, fontSize:14, fontWeight:500, borderRadius:999 }}>Start — US$20 →</a>
        <a className="marq-cta marq-link" href="#programs" style={{ padding:'16px 28px', border:`1px solid ${ink}`, color:ink, fontSize:14, fontWeight:500, borderRadius:999 }}>See all programs →</a>
      </div>
    </section>
  );
}

function Exam() {
  const stats = [['100','Questions'],['180','Minutes'],['4','Domains'],['~30%','Scenario']];
  const rows = [
    ['I', 'AI Governance Foundations', '16–20'],
    ['II', 'Laws, Standards & Compliance Frameworks', '19–23'],
    ['III', 'Governing the AI Development Process', '21–25'],
    ['IV', 'Governing AI Deployment & Use', '21–25'],
  ];
  return (
    <SectionRow idx="01" kicker="The AIGP credential" tone={indigo}
      title={<>One exam. <span style={{ fontStyle:'italic', color: indigo }}>Four domains of governance.</span></>}
      lead="The IAPP Artificial Intelligence Governance Professional credential is a 100-item, 180-minute linear exam covering four domains. Roughly 30% are scenario-based. BoK v2.1.0 took effect February 2, 2026 — emphasizing agentic architectures, third-party risk, and strengthened data governance.">
      <div className="marq-grid-4" style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 14, marginTop: 56 }}>
        {stats.map(([n,l]) => (
          <div key={l} className="marq-card" style={{ background: paper2, padding:'28px 22px', borderRadius:14, border:`1px solid ${rule}`, textAlign:'center' }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 56, fontWeight: 500, color: indigo, letterSpacing:'-0.03em' }}>{n}</div>
            <div className="marq-kicker" style={{ marginTop: 6 }}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 32, border: `1px solid ${ink}`, borderRadius: 14, overflow:'hidden' }}>
        <div style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'14px 24px', background: ink, color: paper, fontSize: 12, letterSpacing:'0.16em', textTransform:'uppercase', fontFamily:'var(--mono)' }}>
          <div>Domain</div><div>Theme</div><div style={{ textAlign:'right' }}>Scored items</div>
        </div>
        {rows.map(([d,t,s], i) => (
          <div key={d} style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'18px 24px', alignItems:'center', borderTop: i ? `1px solid ${rule}` : 'none', background: paper2 }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500 }}>{d}</div>
            <div style={{ fontSize: 15, color: ink }}>{t}</div>
            <div style={{ textAlign:'right', fontFamily:'var(--mono)', fontSize: 13, color: indigo, fontWeight: 600 }}>{s}</div>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function Demo() {
  return (
    <SectionRow idx="02" kicker="See it in action" tone={indigo}
      title={<>Every format. <span style={{ fontStyle:'italic', color: indigo }}>Same knowledge point.</span></>}
      lead="Watch how flashcards, study guide, cram sheet, exam essentials, and narrated lectures all link through a shared KP system — so you study smarter, not more.">
      <div style={{
        marginTop: 40,
        background: '#0c0f14',
        borderRadius: 16,
        overflow: 'hidden',
        boxShadow: '0 12px 48px rgba(0,0,0,0.22)',
        border: '1px solid rgba(255,255,255,0.07)',
      }}>
        <iframe
          src="/academy/demo.html"
          loading="lazy"
          title="JC AIGP Quick Pass Guide — interactive feature tour"
          style={{
            width: '100%',
            height: 'clamp(600px, 80vh, 860px)',
            border: 'none',
            display: 'block',
          }}
          allow="autoplay"
        />
      </div>
    </SectionRow>
  );
}

function WhyOrg() {
  return (
    <SectionRow idx="03" kicker="Why your team needs this" tone={indigo}
      title={<>AI governance <span style={{ fontStyle:'italic', color: indigo }}>is not just an IT question.</span></>}>
      <div style={{ maxWidth: 840, marginTop: 48 }}>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted }}>
          AI is being adopted across legal, compliance, product, operations, and procurement — not just engineering. Each of those functions carries real risk exposure: approving a model without understanding its data lineage, deploying a tool without knowing which regulatory obligations attach, or auditing a vendor's AI system without a shared evaluation framework. Getting AIGP-certified gives the people making these decisions a systematic grounding in what they are actually responsible for.
        </p>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted, marginTop: 28 }}>
          The credential creates a shared vocabulary across teams. When a product manager, a privacy counsel, and a compliance officer all understand the same four domains — AI governance foundations, laws and standards, development governance, and deployment oversight — AI initiatives move faster and land better. Decisions that used to require escalation get made at the right level, with the right context, by people who have the same map.
        </p>
        <p style={{ fontSize: 17, lineHeight: 1.75, color: muted, marginTop: 28 }}>
          One credential, four domains, one Body of Knowledge — updated for the agentic AI era (BoK v2.1.0, effective February 2026). For organizations building AI governance capability from the ground up, AIGP is the most direct path from awareness to verified, exam-proven competency.
        </p>
      </div>
    </SectionRow>
  );
}

function Programs() {
  return (
    <SectionRow idx="04" kicker="Programs" tone={indigo}
      title={<>One credential at a time, <span style={{ fontStyle:'italic', color: indigo }}>built to last.</span></>}>
      <div id="programs" className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: 16, marginTop: 56 }}>
        <div className="marq-card" style={{ background: ink, color: paper, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14, display:'flex', flexDirection:'column' }}>
          <div className="marq-kicker" style={{ color: accent }}>AIGP TRACK · BoK 2.1.0</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 32, fontWeight: 500, marginTop: 16, lineHeight: 1.1, letterSpacing:'-0.02em' }}>JC AIGP Quick Pass Guide</h3>
          <p style={{ fontSize: 15, lineHeight: 1.65, color: 'rgba(241,239,231,0.75)', marginTop: 16 }}>
            A multimodal study system for the IAPP AIGP credential — 500+ knowledge points across six interlocking learning systems. Narrated lectures, study guide, exam essentials, practice bank, flashcards, and cram sheet. Plus an optional self-configured AI tutor (MIT license).
          </p>
          <ul style={{ listStyle:'none', padding: 0, marginTop: 24, display:'grid', gap: 8 }}>
            {['Six learning systems · 500+ KP', 'Personal AI tutor (optional, free)', 'One year of content updates'].map(b => (
              <li key={b} style={{ display:'grid', gridTemplateColumns:'18px 1fr', gap: 10, fontSize: 14, color: 'rgba(241,239,231,0.85)' }}>
                <span style={{ color: accent, fontWeight: 700 }}>✓</span><span>{b}</span>
              </li>
            ))}
          </ul>
          <div style={{ marginTop: 28, fontSize: 13, color: 'rgba(241,239,231,0.6)', fontFamily:'var(--mono)', letterSpacing:'0.06em' }}>
            US$200 / person · Start with US$20 trial
          </div>
          <a className="marq-cta marq-link" href="/academy/buy/" style={{ marginTop: 20, display:'inline-block', padding:'16px 28px', background: accent, color: paper, fontSize: 14, fontWeight: 500, borderRadius: 999, textAlign:'center' }}>Enroll — US$20 →</a>
        </div>
        <div className="marq-card" style={{ background: paper2, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14, border: `1px solid ${rule}`, display:'flex', flexDirection:'column', opacity: 0.75 }}>
          <div className="marq-kicker" style={{ color: muted }}>CIPP TRACK · Coming 2026</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 32, fontWeight: 500, marginTop: 16, lineHeight: 1.1, letterSpacing:'-0.02em', color: muted }}>JC CIPP Quick Pass Guide</h3>
          <p style={{ fontSize: 15, lineHeight: 1.65, color: muted, marginTop: 16 }}>
            Comprehensive prep for the IAPP Certified Information Privacy Professional credential. Same format — study guide, practice bank, essentials, cram sheet — built for privacy law and the CIPP body of knowledge.
          </p>
          <p style={{ fontSize: 13, color: muted, marginTop: 'auto', paddingTop: 40, fontStyle:'italic' }}>
            Launching 2026. Register your interest and we will notify you when enrollment opens.
          </p>
          <span style={{ marginTop: 16, display:'inline-block', padding:'14px 24px', background: rule, color: muted, fontSize: 14, fontWeight: 500, borderRadius: 999, textAlign:'center', cursor:'default' }}>Coming soon</span>
        </div>
      </div>
    </SectionRow>
  );
}

function Fit() {
  const fit = [
    ['Legal, compliance, and privacy counsel who advise on AI decisions.', 'Not just technologists. The people signing off on AI tool adoption, reviewing vendor contracts, and fielding regulatory inquiries.'],
    ['Product managers and program leads overseeing AI systems.', 'Those setting requirements, approving deployments, and owning the product decisions that shape how AI is used.'],
    ['Senior engineers and architects building AI into products.', 'Technical contributors who need to understand governance constraints alongside implementation — not just code-side concerns.'],
    ['Leadership teams building internal AI governance frameworks.', 'Executives and senior managers who need to ask the right questions, allocate risk, and create accountability structures around AI.'],
  ];
  return (
    <SectionRow idx="05" kicker="Who should get certified?" tone={indigo}
      title={<>The right people, <span style={{ fontStyle:'italic', color: indigo }}>not just the obvious ones.</span></>}>
      <div className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: '14px 32px', marginTop: 48 }}>
        {fit.map(([h, b]) => (
          <div key={h} style={{ padding: '24px 0', borderTop: `1px solid ${rule}` }}>
            <h4 style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, marginBottom: 8 }}>{h}</h4>
            <p style={{ fontSize: 14.5, color: muted, lineHeight: 1.6 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function App() {
  return (
    <>
      <Header current="aigp" langHref="/fr/academy/" />
      <Hero />
      <Exam />
      <Demo />
      <WhyOrg />
      <Programs />
      <Fit />
      <Footer extra={<p style={{ marginTop: 24, fontSize: 11, color: muted, lineHeight: 1.65, maxWidth: 720 }}>AIGP® and IAPP® are trademarks of the International Association of Privacy Professionals. Layrix is independent and is not affiliated with, endorsed by, or sponsored by IAPP.</p>} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
