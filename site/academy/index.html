<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Layrix Academy · Layrix</title>

<link rel="alternate" hreflang="en" href="https://layrix.ai/academy/" />
<link rel="alternate" hreflang="fr-CA" href="https://layrix.ai/fr/academy/" />
<link rel="alternate" hreflang="x-default" href="https://layrix.ai/academy/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/site-shared.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/site-chrome.jsx"></script>
<script type="text/babel">
const ink='var(--ink)', paper='var(--paper)', paper2='var(--paper-2)', muted='var(--muted)', rule='var(--rule)', accent='var(--accent)', indigo='var(--indigo)';

function Hero() {
  return (
    <section style={{ padding: '88px clamp(20px, 5vw, 56px) 0', textAlign:'center' }}>
      <h1 className="marq-h1" style={{ fontFamily:'var(--display)', fontWeight:500, fontSize:'clamp(48px, 6.4vw, 92px)', lineHeight:1.04, letterSpacing:'-0.04em', margin:'0 auto', maxWidth: 1200 }}>
        Layrix Academy:<br/><span style={{ fontStyle:'italic', color: indigo }}>From AIGP Knowledge to Team Capability.</span>
      </h1>
      <p style={{ fontSize:19, lineHeight:1.6, color:muted, maxWidth: 760, margin:'40px auto 0' }}>
        Layrix Academy turns AIGP from a specialist concept into an internal capability — so key team members can guide AI adoption with more clarity, consistency, and responsibility.
      </p>
      <p style={{ fontSize:17, lineHeight:1.65, color:muted, maxWidth: 760, margin:'20px auto 0' }}>
        Built around the IAPP's <strong style={{ color: ink }}>Artificial Intelligence Governance Professional</strong> framework, it helps leaders and cross-functional teams develop a systematic understanding of AI governance, risk, compliance, organizational controls, and lifecycle oversight — so they can build, deploy, and manage AI in ways that are responsible, trustworthy, auditable, and operationally effective.
      </p>
      <div className="marq-tag" style={{ borderColor: indigo, color: indigo, marginTop: 36 }}>LAYRIX ACADEMY · AIGP TRACK · BoK 2.1.0</div>
      <p style={{ fontSize:17, lineHeight:1.65, color:muted, maxWidth: 760, margin:'24px auto 0' }}>
        An end-to-end exam-prep system: <strong style={{ color: ink }}>500+ knowledge points</strong>, six interlocking learning modes, optional self-configured AI tutor. One US$200 commitment (plus applicable tax shown at checkout), one 30-day decision window.
      </p>
      <div style={{ display:'flex', gap:12, justifyContent:'center', marginTop: 40, flexWrap:'wrap' }}>
        <a className="marq-cta marq-link" href="/academy/buy/" style={{ padding:'16px 28px', background:ink, color:paper, fontSize:14, fontWeight:500, borderRadius:999 }}>Enroll — US$200, 30-day refund →</a>
        <a className="marq-cta marq-link" href="#systems" style={{ padding:'16px 28px', border:`1px solid ${ink}`, color:ink, fontSize:14, fontWeight:500, borderRadius:999 }}>Explore the curriculum →</a>
      </div>
    </section>
  );
}

function Exam() {
  const stats = [['100','Questions'],['180','Minutes'],['4','Domains'],['~30%','Scenario']];
  const rows = [
    ['I', 'AI Governance Foundations', '16–20'],
    ['II', 'Laws, Standards & Compliance Frameworks', '19–23'],
    ['III', 'Governing the AI Development Process', '21–25'],
    ['IV', 'Governing AI Deployment & Use', '21–25'],
  ];
  return (
    <SectionRow idx="01" kicker="The exam" tone={indigo}
      title={<>What you're <span style={{ fontStyle:'italic', color: indigo }}>actually sitting.</span></>}
      lead="The IAPP Artificial Intelligence Governance Professional credential is a 100-item, 180-minute linear exam covering four domains. Roughly 30% are scenario-based. BoK v2.1.0 took effect February 2, 2026 — emphasizing agentic architectures, third-party risk, and strengthened data governance.">
      <div className="marq-grid-4" style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap: 14, marginTop: 56 }}>
        {stats.map(([n,l]) => (
          <div key={l} className="marq-card" style={{ background: paper2, padding:'28px 22px', borderRadius:14, border:`1px solid ${rule}`, textAlign:'center' }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 56, fontWeight: 500, color: indigo, letterSpacing:'-0.03em' }}>{n}</div>
            <div className="marq-kicker" style={{ marginTop: 6 }}>{l}</div>
          </div>
        ))}
      </div>
      <div style={{ marginTop: 32, border: `1px solid ${ink}`, borderRadius: 14, overflow:'hidden' }}>
        <div style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'14px 24px', background: ink, color: paper, fontSize: 12, letterSpacing:'0.16em', textTransform:'uppercase', fontFamily:'var(--mono)' }}>
          <div>Domain</div><div>Theme</div><div style={{ textAlign:'right' }}>Scored items</div>
        </div>
        {rows.map(([d,t,s], i) => (
          <div key={d} style={{ display:'grid', gridTemplateColumns:'120px 1fr 140px', padding:'18px 24px', alignItems:'center', borderTop: i ? `1px solid ${rule}` : 'none', background: paper2 }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500 }}>{d}</div>
            <div style={{ fontSize: 15, color: ink }}>{t}</div>
            <div style={{ textAlign:'right', fontFamily:'var(--mono)', fontSize: 13, color: indigo, fontWeight: 600 }}>{s}</div>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function Systems() {
  const sys = [
    ['01','Narrated Audio Quick-Tour','Thirteen narrated slide decks (~80 minutes total) with AI-narrated voice, synced subtitle highlighting, and real-time KP cross-referencing on every slide. Designed as a fast pre-study orientation and on-the-go review, not a full video course.'],
    ['02','Study Guide','~500 pages across the four domains. Each KP gets the full treatment: concept definition, regulatory background, practical meaning, and common confusion points. Read it cover-to-cover, then keep it as a lookup manual.'],
    ['03','Exam Essentials','Four volumes, one per domain. For each KP we distill the exam-must-know conclusions — tight, complete, ideal for second- and third-pass review. 200+ core entries across the four domains.'],
    ['04','Practice + Mock Exams','1,100+ practice items organized by KP, domain, and difficulty — with filters, wrong-answer retry, inline explanations, and a built-in error book. Plus five full mock forms (A–E), 100 items each, calibrated to BoK 2.1.0 ratios.'],
    ['05','Flashcards','~300 cards covering each core concept, definition, or critical distinction. KP-tagged and linked back to the practice bank — miss a question, jump straight to the flashcard.'],
    ['06','Cram Sheet','Exam-eve only. One sheet per domain. Key definitions, regulatory frameworks, memory hooks, and high-frequency confusion-point comparisons — the skeleton you scan in the final two hours.'],
  ];
  return (
    <SectionRow idx="02" kicker="Six learning systems · one knowledge base" tone={indigo}
      title={<>Six entries, <span style={{ fontStyle:'italic', color: indigo }}>same destination.</span></>}
      lead="500+ official knowledge points, turned into a single multimodal study system. Every KP available through six interlocking modes — switch surface depending on time and learning style.">
      <div id="systems" className="marq-grid-3" style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap: 16, marginTop: 56 }}>
        {sys.map(([n, h, b]) => (
          <div key={n} className="marq-card" style={{ background: paper2, padding:'28px 26px', borderRadius:14, border:`1px solid ${rule}` }}>
            <div style={{ fontFamily:'var(--display)', fontSize: 48, color: indigo, fontWeight: 500, lineHeight: 1, letterSpacing:'-0.02em' }}>{n}</div>
            <h3 style={{ fontFamily:'var(--display)', fontSize: 26, fontWeight: 500, marginTop: 22, lineHeight: 1.15 }}>{h}</h3>
            <p style={{ fontSize: 14, lineHeight: 1.6, color: muted, marginTop: 12 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function OneKP() {
  const ways = [
    ['Study Guide','the full concept explanation'],
    ['Lecture','core concept walkthrough with dynamic slides'],
    ['Essentials','the exam-must-know takeaways'],
    ['Practice','related items with inline explanation'],
    ['Flashcard','quick concept activation'],
    ['Cram Sheet','final pre-exam confirmation'],
  ];
  return (
    <SectionRow idx="03" kicker="One KP. Six entries." tone={indigo}
      title={<>Whichever fits your <span style={{ fontStyle:'italic', color: indigo }}>time and style.</span></>}>
      <div style={{ marginTop: 48, background: ink, color: paper, borderRadius: 16, padding: 'clamp(28px, 4vw, 48px)' }}>
        <div className="marq-grid-3" style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap: '24px 32px' }}>
          {ways.map(([h, b]) => (
            <div key={h} style={{ borderLeft: `2px solid ${accent}`, paddingLeft: 18 }}>
              <h4 style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, marginBottom: 6 }}>{h}</h4>
              <p style={{ fontSize: 14, color: 'rgba(241,239,231,0.7)', lineHeight: 1.55 }}>{b}</p>
            </div>
          ))}
        </div>
        <p style={{ fontSize: 14, color: 'rgba(241,239,231,0.6)', marginTop: 32, fontStyle:'italic' }}>
          Visual learner, auditory learner, or question-driven — one KP, six entries, and at least one of them will make it stick.
        </p>
      </div>
    </SectionRow>
  );
}

function Tutor() {
  return (
    <SectionRow idx="07" kicker="Free · MIT-licensed · Optional" tone={indigo}
      title={<>A personal AI tutor, <span style={{ fontStyle:'italic', color: indigo }}>if you want one.</span></>}
      lead={<>We publish the full <strong style={{ color: ink }}>500+ KP knowledge base</strong> as a pre-trained Chroma vector dataset — <strong style={{ color: ink }}>free, under the MIT License.</strong> Import it into any local LLM (Gemma 4 or compatible) and build your own private AIGP study Q&amp;A tutor. No purchase required, no API key, no telemetry to Layrix.</>}>
      <div style={{ display:'flex', gap: 10, marginTop: 32, flexWrap:'wrap' }}>
        <span className="marq-tag" style={{ borderColor: indigo, color: indigo, fontFamily:'var(--mono)' }}>MIT LICENSE</span>
        <span className="marq-tag" style={{ borderColor: indigo, color: indigo, fontFamily:'var(--mono)' }}>FREE DOWNLOAD</span>
        <span className="marq-tag" style={{ borderColor: indigo, color: indigo, fontFamily:'var(--mono)' }}>LOCAL · OFFLINE</span>
      </div>
      <div style={{ marginTop: 32, padding: 32, background: paper2, border: `1px solid ${rule}`, borderRadius: 14, maxWidth: 920 }}>
        <div className="marq-kicker" style={{ color: indigo, marginBottom: 14 }}>Example prompt</div>
        <p style={{ fontFamily:'var(--display)', fontSize: 22, fontStyle:'italic', color: ink, lineHeight: 1.4 }}>
          "What obligations apply to high-risk systems under EU AI Act Chapter III?"
        </p>
        <p style={{ fontSize: 14.5, color: muted, marginTop: 16, lineHeight: 1.65 }}>
          The model answers from the 500+ KP knowledge base, citing the source KP ID for every claim.
        </p>
      </div>
      <p style={{ fontSize: 14.5, color: muted, marginTop: 24, maxWidth: 760, lineHeight: 1.65 }}>
        Built for technically inclined learners. If you have no interest in setting up a local LLM, the six core learning systems are complete on their own — no AI tooling required.
      </p>
    </SectionRow>
  );
}

function Sample() {
  return (
    <SectionRow idx="04" kicker="A question from the bank" tone={indigo}
      title={<>One item, <span style={{ fontStyle:'italic', color: indigo }}>fully shown.</span></>}>
      <div style={{ marginTop: 48, background: paper2, border: `1px solid ${rule}`, borderRadius: 14, padding: 'clamp(28px, 4vw, 40px)' }}>
        <div className="marq-kicker" style={{ color: indigo, marginBottom: 16 }}>Domain II · Laws, Standards & Frameworks · BoK v2.1 aligned</div>
        <div style={{ fontSize: 15.5, lineHeight: 1.75, color: muted, paddingBottom: 24, borderBottom: `1px solid ${rule}` }}>
          A multinational SaaS vendor based in Toronto is launching a customer-support chatbot for EU-resident end users. The product team wants to use a third-party foundation model accessed through an API and fine-tune it on six months of historical support tickets. Legal has flagged that the chatbot may qualify as a high-risk AI system under the EU AI Act because of how it handles complaints, while privacy counsel is asking which obligations attach to the fine-tuning data.
        </div>
        <p style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, color: ink, marginTop: 24, lineHeight: 1.35 }}>
          Which combination of obligations is most likely to apply before the chatbot is placed on the EU market?
        </p>
        <ol style={{ listStyle:'none', padding: 0, marginTop: 22, display:'grid', gap: 10 }}>
          {[
            ['A', 'Article 30 records of processing on the support tickets, an EU AI Act conformity assessment, and a DPIA covering the fine-tuning.', true],
            ['B', "An EU AI Act conformity assessment, with the foundation model provider's diligence covering downstream GDPR controller duties on the deployer's behalf.", false],
            ['C', "GDPR breach notification procedures and an algorithmic impact assessment under Canada's AIDA, applied because the vendor is headquartered in Toronto.", false],
            ['D', "A data protection impact assessment, since complaint-handling chatbots fall outside the EU AI Act's high-risk classification by default.", false],
          ].map(([k, t, c]) => (
            <li key={k} style={{ display:'grid', gridTemplateColumns:'40px 1fr', gap: 16, padding: '14px 20px', background: c ? 'rgba(47,111,74,0.06)' : paper, border: `1px solid ${c ? accent : rule}`, borderRadius: 10, alignItems:'baseline' }}>
              <span style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, color: c ? accent : muted }}>{k}</span>
              <span style={{ fontSize: 14.5, lineHeight: 1.6, color: ink }}>{t}</span>
            </li>
          ))}
        </ol>
        <details style={{ marginTop: 28, borderTop: `1px solid ${rule}` }}>
          <summary>Show explanation</summary>
          <div className="ans">
            <p style={{ marginBottom: 14 }}>The correct answer combines three independent obligations that all attach in this scenario. EU controllers and processors must maintain Article 30 records of processing whenever they handle personal data, and historical support tickets qualify. The EU AI Act's conformity assessment requirement is triggered before a high-risk AI system is placed on the EU market — and a chatbot used to evaluate or route complaints in a regulated service is a candidate for high-risk classification on a fact-specific basis. Fine-tuning a foundation model on personal data meets the GDPR threshold for a DPIA.</p>
            <p>The other choices each fail on one fact. A foundation-model provider's own diligence does not discharge a deployer's GDPR controller duties. Canada's AIDA had not yet come into force as of the BoK v2.1 timeframe. And chatbots are not categorically excluded from high-risk classification.</p>
          </div>
        </details>
        <p style={{ fontSize: 12, color: muted, fontStyle:'italic', marginTop: 18 }}>Representative original item from our 1,100+ question bank.</p>
      </div>
    </SectionRow>
  );
}

function Pricing() {
  const steps = [
    ['Day 0', 'Pay US$200. Get Domain I (Preview) immediately. Start studying.'],
    ['By Day 30', 'Decide: request a refund (email order@layrix.ai, no reason required), or upgrade to Full (all four domains, $0 extra) — once upgraded, the refund option closes.'],
    ['After Day 30', 'Auto-upgrade to Full. Your account unlocks all four domains automatically, no further charges, ever.'],
  ];
  return (
    <SectionRow idx="05" kicker="Pricing & guarantee" tone={indigo}
      title={<>Try first. <span style={{ fontStyle:'italic', color: indigo }}>Then decide.</span></>}>
      <div className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1.2fr 1fr', gap: 16, marginTop: 56 }}>
        <div className="marq-card" style={{ background: ink, color: paper, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14 }}>
          <div className="marq-kicker" style={{ color: accent }}>One-time purchase</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 36, fontWeight: 500, marginTop: 14, letterSpacing:'-0.025em' }}>JC AIGP QUICK PASS 2026</h3>
          <div style={{ marginTop: 22, display:'flex', alignItems:'baseline', gap: 12 }}>
            <span style={{ fontFamily:'var(--display)', fontSize: 88, fontWeight: 500, color: paper, letterSpacing:'-0.04em', lineHeight: 1 }}>US$200</span>
            <span style={{ fontSize: 13, color: 'rgba(241,239,231,0.6)' }}>· per person</span>
          </div>
          <ul style={{ listStyle:'none', padding: 0, marginTop: 28, display:'grid', gap: 10 }}>
            {['All six learning systems', 'One year of content updates aligned with BoK 2.1.0', '30-day decision window — full refund or upgrade to all four domains'].map(b => (
              <li key={b} style={{ display:'grid', gridTemplateColumns:'20px 1fr', gap: 10, fontSize: 14, color: 'rgba(241,239,231,0.85)' }}>
                <span style={{ color: accent, fontWeight: 700 }}>✓</span><span>{b}</span>
              </li>
            ))}
          </ul>
          <a className="marq-cta marq-link" href="/academy/buy/" style={{ marginTop: 32, display:'inline-block', padding:'16px 28px', background: accent, color: paper, fontSize: 14, fontWeight: 500, borderRadius: 999 }}>Enroll — US$200 →</a>
        </div>
        <div className="marq-card" style={{ background: paper2, padding: 'clamp(28px, 3vw, 40px)', borderRadius: 14, border: `1px solid ${rule}` }}>
          <div className="marq-kicker">How it works</div>
          <h3 style={{ fontFamily:'var(--display)', fontSize: 28, fontWeight: 500, marginTop: 14, letterSpacing:'-0.02em' }}>One purchase. One 30-day window.</h3>
          <div style={{ marginTop: 24, display:'grid', gap: 18 }}>
            {steps.map(([k, v]) => (
              <div key={k}>
                <div className="marq-kicker" style={{ color: indigo }}>{k}</div>
                <div style={{ fontSize: 15, color: ink, marginTop: 4, lineHeight: 1.55 }}>{v}</div>
              </div>
            ))}
          </div>
          <p style={{ fontSize: 13.5, color: muted, marginTop: 24, fontStyle:'italic', lineHeight: 1.6 }}>
            We built it this way because the best way to earn trust is to let you try, then decide. Risk is on us for the first 30 days.
          </p>
        </div>
      </div>
    </SectionRow>
  );
}

function Fit() {
  const fit = [
    ['You\'re planning to sit the AIGP within 12 months.', 'Not casually browsing the field, but actually scheduled to test.'],
    ['You already have some grounding in AI, privacy, or compliance.', 'And want systematic exam-targeted prep, not a primer.'],
    ['You study in fragments.', 'Commutes, evenings, weekends — you need a multimodal kit that plugs into whatever time slot you have.'],
    ['You want one end-to-end package.', 'Covering foundation reading, practice, and final-sprint prep — not a stack of disconnected tools.'],
  ];
  return (
    <SectionRow idx="06" kicker="Is this for you?" tone={indigo}
      title={<>Be honest about <span style={{ fontStyle:'italic', color: indigo }}>whether it fits.</span></>}>
      <div className="marq-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: '14px 32px', marginTop: 48 }}>
        {fit.map(([h, b]) => (
          <div key={h} style={{ padding: '24px 0', borderTop: `1px solid ${rule}` }}>
            <h4 style={{ fontFamily:'var(--display)', fontSize: 22, fontWeight: 500, marginBottom: 8 }}>{h}</h4>
            <p style={{ fontSize: 14.5, color: muted, lineHeight: 1.6 }}>{b}</p>
          </div>
        ))}
      </div>
    </SectionRow>
  );
}

function FAQ() {
  const faqs = [
    ['Is this affiliated with IAPP?', 'No. JC AIGP QUICK PASS is independent. We prepare you for IAPP\'s AIGP exam, but we are not endorsed by, partnered with, or licensed by the International Association of Privacy Professionals. AIGP® and IAPP® are their trademarks.'],
    ['Where does the content come from?', 'Every lecture, study-guide section, essentials entry, practice item, flashcard, and cram-sheet line is written from scratch against the published BoK 2.1.0 outline. We do not include IAPP exam excerpts or transcribed practice items.'],
    ['How does the 30-day decision window work?', 'You pay US$200 once. From Day 0, you have access to Domain I (Preview). Within 30 days you can (a) email us for a full refund — no reason required, or (b) upgrade to the Full Edition at no extra cost, unlocking all four domains, after which the refund option will no longer be available. After Day 30, your account automatically upgrades to Full, and the refund policy will no longer apply.'],
    ['What\'s the AI Tutor — and is it required?', 'Optional and self-configured. We publish the Chroma vector knowledge base covering the 500+ KP corpus for free under MIT License. Import into a local LLM (Gemma 4 or compatible). If you have no interest in setting up a local model, the six core learning systems are complete on their own.'],
    ['Are there device or download limits?', 'Yes. A license activates on up to two devices and supports four lifetime downloads in case you switch laptops. Both limits are enforced server-side at activation.'],
    ['How long do content updates last?', 'One year from purchase. We ship corrections, new mock forms, and BoK alignment updates throughout that year. After the year ends, your existing files keep working — you just stop receiving new content.'],
  ];
  return (
    <SectionRow idx="08" kicker="FAQ" tone={indigo}
      title={<>Questions, <span style={{ fontStyle:'italic', color: indigo }}>answered.</span></>}>
      <div style={{ marginTop: 32, maxWidth: 920 }}>
        {faqs.map(([q, a]) => (
          <details key={q}><summary>{q}</summary><div className="ans">{a}</div></details>
        ))}
      </div>
    </SectionRow>
  );
}

function App() {
  return (
    <>
      <Header current="aigp" langHref="/fr/academy/" />
      <Hero />
      <Exam />
      <Systems />
      <OneKP />
      <Sample />
      <Pricing />
      <Fit />
      <Tutor />
      <FAQ />
      <Footer extra={<p style={{ marginTop: 24, fontSize: 11, color: muted, lineHeight: 1.65, maxWidth: 720 }}>AIGP® and IAPP® are trademarks of the International Association of Privacy Professionals. Layrix is independent and is not affiliated with, endorsed by, or sponsored by IAPP.</p>} />
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
